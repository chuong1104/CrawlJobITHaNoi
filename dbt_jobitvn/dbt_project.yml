name: 'dbt_jobitvn'
version: '2.1.0'
config-version: 2

profile: 'dbt_jobitvn'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_jobitvn:
    staging:
      +materialized: view
      +tags: ["bronze_to_silver", "daily"]
    intermediate:
      +materialized: table
      +tags: ["silver", "daily"]
    marts:
      +enabled: true
      warehouse:
        +materialized: table
        +tags: ["gold", "kimball", "daily"]
      mart_bi:
        +materialized: table
        +tags: ["gold", "bi", "power_bi", "daily"]


# Semantic Layer (MetricFlow) — định nghĩa trong models/metrics/*.yml
# Dùng: dbt sl list metrics / dbt sl query --metrics total_active_jobs

