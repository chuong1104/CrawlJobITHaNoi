name: 'dbt_jobitvn'
version: '2.0.0'
config-version: 2

profile: 'dbt_jobitvn'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_jobitvn:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +enabled: true
      warehouse:
        +materialized: table
        +schema: dwh
      mart_bi:
        +materialized: view
        +schema: mart_bi
      mart_api:
        +enabled: false
      mart_ml:
        +enabled: false
