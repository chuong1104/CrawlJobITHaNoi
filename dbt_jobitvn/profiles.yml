dbt_jobitvn:
  outputs:
    # Target dùng DuckDB để parse JSONL từ Bronze -> Intermediate
    duckdb_dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/data/jobitvn.duckdb') }}"
      threads: 4
      extensions:
        - parquet
        - httpfs
        - aws
        - delta    # Đọc Delta Lake tables trực tiếp từ S3 bằng delta_scan()
      settings:
        s3_endpoint: "{{ env_var('AWS_ENDPOINT_URL', 'localhost:4566') | replace('http://', '') | replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'test') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'test') }}"
        s3_region: "{{ env_var('AWS_DEFAULT_REGION', 'us-east-1') }}"
        s3_use_ssl: "false"
        s3_url_style: "path"

    # Target dùng PostgreSQL để build Data Warehouse & Marts (Gold) từ Silver
    pg_dev:
      type: postgres
      threads: 4
      host: "{{ env_var('DB_HOST', 'postgres') }}"
      port: 5432
      user: "{{ env_var('DB_USER', 'postgres') }}"
      pass: "{{ env_var('DB_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('DB_NAME', 'jobitvn') }}"
      schema: dwh
      
  # Default: DuckDB (toàn bộ pipeline từ Bronze → Gold đều chạy trên DuckDB)
  # Để dùng PostgreSQL cho Gold: dbt run --target pg_dev
  target: duckdb_dev
