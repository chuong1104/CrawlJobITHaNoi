dbt_jobitvn:
  outputs:
    # Target dùng DuckDB để parse JSONL từ Bronze -> Intermediate
    duckdb_dev:
      type: duckdb
      path: 'jobitvn.duckdb'
      threads: 4
      extensions:
        - parquet
        - httpfs

    # Target dùng PostgreSQL để build Data Warehouse & Marts (Gold) từ Silver
    pg_dev:
      type: postgres
      threads: 4
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('DB_USER', 'postgres') }}"
      pass: "{{ env_var('DB_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('DB_NAME', 'jobitvn') }}"
      schema: dwh
      
  # Đặt mặc định là postgres cho tầng Gold, khi chạy Bronze->Silver có thể override bằng cờ --target duckdb_dev
  target: pg_dev
