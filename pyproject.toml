[project]
name = "job-scraper-de-project"
version = "2.0.0"
description = "Job Scraper Data Engineering Project Web Portal"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "aiofiles>=23.2.0",
]

[tool.vercel]
entrypoint = "api.index:app"
